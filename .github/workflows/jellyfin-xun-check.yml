name: Check Jellyfin Xun

on:
  pull_request:
    paths:
      - 'src/all/jellyfinxun/**'
      - 'core/**'
      - 'gradle/**'
      - '.github/workflows/jellyfin-xun-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify security tests and build trial APK
        run: ./gradlew :src:all:jellyfinxun:spotlessCheck :src:all:jellyfinxun:testDebugUnitTest :src:all:jellyfinxun:assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jellyfin-xun-trial
          path: |
            src/all/jellyfinxun/build/outputs/apk/debug/*.apk
            src/all/jellyfinxun/build/reports/tests/testDebugUnitTest/
